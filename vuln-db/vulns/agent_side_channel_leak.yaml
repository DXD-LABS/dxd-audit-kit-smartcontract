name: AGENT-013 Side-Channel Data Leak in Privacy-Protected Agent Memory
date: 2026-03-07
loss: "Simulated (privacy breach $500k+ class-action equivalent)"
description: >
  An agent stores per-user memory (intent state, balances) using variable-size
  data structures. Even when guarded by zk/TEE wrappers, the on-chain gas
  consumption or dynamic field size varies based on secret data, creating a
  timing/size side-channel. An observer monitoring transaction gas or object
  byte growth can infer the contents of private agent memory (wallet balances,
  intent payload length, number of recent actions). Root cause: memory block
  size grows proportionally to sensitive data rather than being padded to a
  fixed constant-size block.
impact: "Critical (user data exposure, regulatory liability in private agents)"
severity: Critical
code_vuln: |
  // ❌ VULNERABLE: memory block size leaks data via gas/size side-channel
  public fun store_agent_memory_vulnerable(
      wallet: &mut AgentWallet,
      memory_data: vector<u8>,  // Variable length — leaks data size
      ctx: &mut TxContext,
  ) {
      // Dynamic field size grows with data — observable by on-chain size queries
      dynamic_field::add(&mut wallet.id, b"memory", memory_data);
  }
code_fixed: |
  // ✅ FIXED: constant-size padding prevents size-based side-channel
  const FIXED_BLOCK_SIZE: u64 = 256; // Fixed memory block size

  public fun store_agent_memory_fixed(
      wallet: &mut AgentWallet,
      memory_data: vector<u8>,
      ctx: &mut TxContext,
  ) {
      // Reject if data exceeds fixed block (caller must pre-chunk)
      assert!(vector::length(&memory_data) <= FIXED_BLOCK_SIZE, E_OVERSIZED_MEMORY);
      // Pad to fixed block size — constant gas and constant on-chain size
      let mut padded = memory_data;
      while (vector::length(&padded) < FIXED_BLOCK_SIZE) {
          vector::push_back(&mut padded, 0u8);
      };
      // Only store commitment hash on-chain, not raw data
      dynamic_field::add(&mut wallet.id, b"memory_commit",
          hash::blake2b256(&padded));
  }
test_vector:
  inputs:
    memory_data_small: "0x01"
    memory_data_large: "0x" # 200-byte payload
    observer: "gas_cost_diff > 500_mist"
  expected_exploit: Gas difference between small/large memory writes reveals data presence and approximate size
references:
  - https://arxiv.org/html/2601.04583v1
  - https://docs.sui.io/concepts/cryptography/zklogin
  - https://docs.sui.io/guides/developer/getting-started/nautilus

sui_specific: true
