id: DXD-SUI-2025-030
name: zk-Intent Proof Replay (Missing Nullifier)
date: 2026-03-06
loss: N/A (High risk — dependent on TVL of protocol)
description: 'A smart contract accepted the same zero-knowledge intent proof multiple
  times because the nullifier registry was not checked on-chain. This allowed an attacker
  to replay the same zk-proof across multiple transactions, executing the same intent
  action more than once. The root cause is the absence of a nullifier uniqueness check
  before allowing action execution. Each zk-proof must consume a unique nullifier
  that is recorded on-chain and rejected on second submission.

  '
impact: High — double-execution of intent, potential fund drain or state corruption.
severity: High
references:
- https://docs.sui.io/concepts/cryptography/zklogin
- https://eprint.iacr.org/2021/1190
code_vuln: "// ❌ VULNERABLE: no nullifier check, proof can be replayed\npublic fun\
  \ execute_action(\n    proof: &ZkProof,\n    action: &mut ActionRecord,\n) {\n \
  \   assert!(proof.is_valid, E_PROOF_INVALID);\n    action.executed = true;\n}\n"
code_fixed: "// ✅ FIXED: nullifier uniqueness enforced before execution\npublic fun\
  \ execute_action(\n    proof: &ZkProof,\n    registry: &mut NullifierRegistry,\n\
  \    action: &mut ActionRecord,\n) {\n    assert!(proof.is_valid, E_PROOF_INVALID);\n\
  \    // Reject if nullifier already spent\n    assert!(\n        !table::contains(&registry.registry,\
  \ proof.nullifier),\n        E_DOUBLE_SPEND\n    );\n    // Record nullifier as\
  \ spent\n    table::add(&mut registry.registry, proof.nullifier, true);\n    action.intent_hash\
  \ = proof.intent_hash;\n    action.executed = true;\n}\n"
test_vector:
  inputs:
    proof_is_valid: true
    nullifier: '0xabc123'
    already_spent: true
  expected_exploit: Proof replayed — action executed twice with same nullifier
bvss:
  impact: High
  likelihood: Medium
  exploitability: Network
  economic_loss: Millions
  scope: Unchanged
  is_immutable: true
  exploit_maturity: POC
  privileged_access: Not Required
