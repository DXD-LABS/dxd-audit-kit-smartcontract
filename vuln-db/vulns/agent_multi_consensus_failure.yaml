id: DXD-SUI-2025-013
name: AGENT-010 Multi-Agent Consensus Failure via Byzantine Rogue Agent
date: 2026-03-07
loss: Simulated (multi-agent drain $200k+)
description: 'In a multi-agent workflow, a rogue (Byzantine) agent injects faulty
  votes or approvals into a shared consensus object without signature verification.
  The contract tallies unverified votes and grants approval even when the cryptographically-verified
  threshold is not met. This allows the rogue agent to trigger a shared vault drain,
  unauthorized treasury sweep, or intent execution below quorum. Root cause: the vote
  counter accepts any caller''s vote without verifying an agent signature or membership
  proof.

  '
impact: High (ecosystem-wide if agent swarms control large treasuries)
severity: High
code_vuln: "// ❌ VULNERABLE: votes accepted without signature verification\npublic\
  \ entry fun cast_vote_vulnerable(\n    consensus: &mut SwarmConsensus,\n    approve:\
  \ bool,\n    ctx: &mut TxContext,\n) {\n    // Anyone can call — no agent identity\
  \ or signature check\n    if (approve) { consensus.approve_count = consensus.approve_count\
  \ + 1 };\n    if (consensus.approve_count >= consensus.threshold) {\n        consensus.approved\
  \ = true; // Threshold met by rogue actors\n    }\n}\n\npublic entry fun execute_if_approved_vulnerable(\n\
  \    consensus: &SwarmConsensus,\n    vault: &mut SwarmVault,\n    target: address,\n\
  \    ctx: &mut TxContext,\n) {\n    assert!(consensus.approved, E_NOT_APPROVED);\n\
  \    let extracted = coin::split(&mut vault.balance, vault.drain_amount, ctx);\n\
  \    transfer::public_transfer(extracted, target);\n}\n"
code_fixed: "// ✅ FIXED: verified_votes counter gated by per-agent signature check\n\
  public entry fun cast_vote_fixed(\n    consensus: &mut SwarmConsensus,\n    approve:\
  \ bool,\n    agent_sig: vector<u8>,\n    ctx: &mut TxContext,\n) {\n    let sender\
  \ = tx_context::sender(ctx);\n    // Verify agent is a registered member with valid\
  \ signature\n    assert!(table::contains(&consensus.registered_agents, sender),\
  \ E_UNKNOWN_AGENT);\n    let msg = bcs::to_bytes(&approve);\n    assert!(ed25519::ed25519_verify(&agent_sig,\
  \ &sender_pubkey(consensus, sender), &msg),\n            E_INVALID_SIGNATURE);\n\
  \    if (approve) { consensus.verified_votes = consensus.verified_votes + 1 };\n\
  \    if (consensus.verified_votes >= consensus.threshold) {\n        consensus.approved\
  \ = true;\n    }\n}\n"
test_vector:
  inputs:
    rogue_agents: 3
    threshold: 5
    total_registered: 7
    verified_votes_after_rogue: 3
  expected_exploit: consensus.approved set to true with only 3 unverified votes out
    of threshold=5
references:
- https://arxiv.org/html/2601.04583v1
- https://docs.sui.io/concepts/object-ownership/shared
sui_specific: true
bvss:
  impact: High
  likelihood: Medium
  exploitability: Network
  economic_loss: Millions
  scope: Unchanged
  is_immutable: true
  exploit_maturity: POC
  privileged_access: Not Required
