id: DXD-SUI-2025-021
name: AGENT-008 Privacy Leak via Unverified ZK-Intent in Agent Execution
date: 2026-03-07
loss: Simulated ($100k+ in privacy-compromised assets)
description: 'An agent executes a transaction based on a zk-proof intent but does
  not fully verify the proof fields, allowing sensitive data (user wallet state, off-chain
  memory, intent payload) to be exposed via on-chain dynamic fields or side-channels.
  The root cause is accepting a ZkIntentProof without asserting that no sensitive
  data is exposed through proof.public_inputs or leaked dynamic field writes. An attacker
  who can observe on-chain object state can extract the user''s intent or balance
  information.

  '
impact: Critical (data exfil, user privacy breach in agentic economy)
severity: Critical
code_vuln: "// ❌ VULNERABLE: proof accepted without field-level privacy check\npublic\
  \ fun execute_zk_intent_vulnerable(\n    proof: &ZkIntentProof,\n    wallet: &mut\
  \ AgentWallet,\n    ctx: &mut TxContext,\n) {\n    assert!(proof.is_valid, E_PROOF_INVALID);\n\
  \    // Missing: no check that proof.public_inputs does not expose wallet balance\n\
  \    // Dynamic field write leaks sensitive state to on-chain observers\n    dynamic_field::add(&mut\
  \ wallet.id, b\"last_intent\", proof.public_inputs);\n    wallet.balance = wallet.balance\
  \ - proof.amount;\n}\n"
code_fixed: "// ✅ FIXED: full field verification + data exposure guard\npublic fun\
  \ execute_zk_intent_fixed(\n    proof: &ZkIntentProof,\n    wallet: &mut AgentWallet,\n\
  \    ctx: &mut TxContext,\n) {\n    assert!(proof.is_valid, E_PROOF_INVALID);\n\
  \    // Guard: proof must not expose sensitive data in public inputs\n    assert!(!proof.exposes_sensitive_data,\
  \ E_PRIVACY_VIOLATION);\n    // Only write a commitment hash, never raw public inputs\n\
  \    dynamic_field::add(&mut wallet.id, b\"last_intent_hash\",\n        hash::blake2b256(&proof.public_inputs));\n\
  \    wallet.balance = wallet.balance - proof.amount;\n}\n"
test_vector:
  inputs:
    proof_is_valid: true
    exposes_sensitive_data: true
    public_inputs: 0xSECRET_WALLET_STATE
  expected_exploit: Sensitive wallet state written to on-chain dynamic field and observable
    by any reader
references:
- https://arxiv.org/html/2602.04567v1
- https://genai.owasp.org/resource/owasp-top-10-for-agentic-ai-v1-0/
- https://docs.sui.io/concepts/cryptography/zklogin
- https://docs.sui.io/guides/developer/getting-started/nautilus
sui_specific: true
bvss:
  impact: Critical
  likelihood: Medium
  exploitability: Network
  economic_loss: Millions
  scope: Unchanged
  is_immutable: true
  exploit_maturity: POC
  privileged_access: Not Required
