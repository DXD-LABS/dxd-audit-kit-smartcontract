name: AGENT-006 Shared Object Race in Multi-Agent Workflow
date: 2025-12-06
loss: Simulated extraction race conditions
description: Multiple agents accessing a shared object (e.g., treasury vault) sequentially without atomic operations exploit race conditions.
impact: High
severity: High
code_vuln: |
  public entry fun prepare_extraction_vulnerable(treasury: &mut SharedTreasury) {
      treasury.extraction_locked = true;
  }
  public entry fun execute_extraction_vulnerable(
      treasury: &mut SharedTreasury, amount: u64, target: address, ctx: &mut TxContext
  ) {
      assert!(treasury.extraction_locked == true, ERaceConditionExploited);
      let extracted = coin::split(&mut treasury.balance, amount, ctx);
      transfer::public_transfer(extracted, target);
      treasury.extraction_locked = false; // Reset
  }
code_fixed: |
  public struct ExtractionTicket { amount: u64 }
  public fun prepare_extraction_fixed(treasury: &mut SharedTreasury, amount: u64): ExtractionTicket {
      treasury.extraction_locked = true;
      ExtractionTicket { amount }
  }
  public fun execute_extraction_fixed(
      treasury: &mut SharedTreasury, ticket: ExtractionTicket, target: address, ctx: &mut TxContext
  ) {
      let ExtractionTicket { amount } = ticket;
      assert!(treasury.extraction_locked == true, ERaceConditionExploited);
      let extracted = coin::split(&mut treasury.balance, amount, ctx);
      transfer::public_transfer(extracted, target);
      treasury.extraction_locked = false; // Reset
  }
test_vector: Trigger race condition by making agent B modify vault state immediately after agent A prepares it.
references:
  - https://arxiv.org/html/2601.04583v1

sui_specific: true
