name: AGENT-012 BTCfi Oracle Manipulation in Agent-Driven Trades
date: 2026-03-07
loss: "Simulated (oracle skew leading to $150k+ bad debt)"
description: >
  An agent relies on a single BTCfi oracle feed (e.g., BTC/SUI price) for
  liquidation or collateral valuation decisions. An attacker manipulates the
  off-chain oracle price feed (e.g., via TWAP manipulation, stale data replay,
  or poisoning the oracle provider) causing the agent to execute a liquidation
  at a significantly skewed price. The on-chain contract accepts the oracle
  value without deviation bounds or multi-feed aggregation, creating bad debt
  or enabling the attacker to front-run liquidations at incorrect valuations.
  Root cause: single-source oracle with no staleness check or deviation guard.
impact: "High (protocol bad debt, user fund loss, fits Sui BTCfi expansion 2026)"
severity: High
code_vuln: |
  // ❌ VULNERABLE: single oracle, no staleness or deviation check
  public entry fun liquidate_vulnerable(
      oracle: &OracleFeed,
      vault: &mut LiquidationVault,
      borrower: address,
      ctx: &mut TxContext,
  ) {
      let price = oracle.btc_sui_price; // Single-source, unvalidated
      let collateral_value = vault.collateral_amount * price;
      // Liquidate if undercollateralized — price can be manipulated
      if (collateral_value < vault.debt_amount) {
          let seized = coin::split(&mut vault.collateral, vault.collateral_amount, ctx);
          transfer::public_transfer(seized, ctx.sender());
      }
  }
code_fixed: |
  // ✅ FIXED: multi-oracle aggregation + deviation bound + staleness check
  public entry fun liquidate_fixed(
      oracle_a: &OracleFeed,
      oracle_b: &OracleFeed,
      vault: &mut LiquidationVault,
      current_epoch: u64,
      ctx: &mut TxContext,
  ) {
      // Staleness: both feeds must be fresh
      assert!(current_epoch - oracle_a.last_updated <= MAX_STALE_EPOCHS, E_STALE_PRICE);
      assert!(current_epoch - oracle_b.last_updated <= MAX_STALE_EPOCHS, E_STALE_PRICE);
      // Deviation guard: feeds must agree within 5%
      let avg_price = (oracle_a.btc_sui_price + oracle_b.btc_sui_price) / 2;
      let deviation = if (oracle_a.btc_sui_price > oracle_b.btc_sui_price) {
          oracle_a.btc_sui_price - oracle_b.btc_sui_price
      } else {
          oracle_b.btc_sui_price - oracle_a.btc_sui_price
      };
      assert!(deviation * 10000 / avg_price <= MAX_DEVIATION_BPS, E_PRICE_DEVIATION);
      let collateral_value = vault.collateral_amount * avg_price;
      if (collateral_value < vault.debt_amount) {
          let seized = coin::split(&mut vault.collateral, vault.collateral_amount, ctx);
          transfer::public_transfer(seized, ctx.sender());
      }
  }
test_vector:
  inputs:
    oracle_a_price: 200000
    oracle_b_price: 100000
    deviation_pct: 50
    max_deviation_bps: 500
  expected_exploit: Liquidation executes at 2x normal price via poisoned oracle_a; bad debt created
references:
  - https://docs.sui.io/concepts/sui-architecture
  - https://arxiv.org/html/2601.04583v1

sui_specific: true
