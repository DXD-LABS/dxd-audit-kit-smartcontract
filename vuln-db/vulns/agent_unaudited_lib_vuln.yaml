id: DXD-SUI-2025-019
name: AGENT-014 Unaudited Lib Dependency in Agent Modules
date: 2026-03-07
loss: Simulated ($300k+ via lib vuln cascade)
description: 'An agent module imports a third-party Move library (e.g., a zk helper
  or TEE SDK) that has not been audited and contains a backdoor: a public init function
  that mints an AdminCap accessible to any caller. On deployment or first use, an
  attacker calls the backdoor to extract the AdminCap and gain full admin control
  over the agent module (drain treasury, upgrade packages, modify agent policies).
  Root cause: no verification that imported library packages are from audited, trusted
  sources before integration into the agent.

  '
impact: High (systemic if lib popular in agentic economy; full admin takeover)
severity: High
code_vuln: "// ❌ VULNERABLE: imports unaudited lib that exposes backdoor AdminCap\
  \ mint\n// (simulating a malicious third-party Move package)\nmodule agent_specific::bad_lib\
  \ {\n    use sui::object::{Self, UID};\n    use sui::tx_context::TxContext;\n  \
  \  use sui::transfer;\n\n    public struct BadAdminCap has key, store { id: UID\
  \ }\n\n    // Backdoor: any caller can mint an AdminCap\n    public fun backdoor_mint_cap(ctx:\
  \ &mut TxContext): BadAdminCap {\n        BadAdminCap { id: object::new(ctx) }\n\
  \    }\n}\n\n// Agent module consuming the unaudited lib\npublic entry fun use_lib_vulnerable(ctx:\
  \ &mut TxContext) {\n    let cap = bad_lib::backdoor_mint_cap(ctx); // Attacker\
  \ calls this directly\n    transfer::public_transfer(cap, tx_context::sender(ctx));\n\
  }\n"
code_fixed: "// ✅ FIXED: audit_verified flag + static rule prevents unaudited libs\n\
  public struct LibRegistry has key {\n    id: UID,\n    audit_verified: bool,\n \
  \   auditor: address,\n}\n\npublic entry fun register_lib(\n    registry: &mut LibRegistry,\n\
  \    auditor_sig: vector<u8>,\n    ctx: &mut TxContext,\n) {\n    let auditor =\
  \ tx_context::sender(ctx);\n    // Only whitelisted auditors can mark lib as verified\n\
  \    assert!(is_whitelisted_auditor(auditor), E_UNVERIFIED_AUDITOR);\n    registry.audit_verified\
  \ = true;\n    registry.auditor = auditor;\n}\n\npublic entry fun use_lib_fixed(\n\
  \    registry: &LibRegistry,\n    ctx: &mut TxContext,\n) {\n    // Abort if lib\
  \ has not been audited and registered\n    assert!(registry.audit_verified, E_UNAUDITED_LIB);\n\
  \    // ... safe lib usage\n}\n"
test_vector:
  inputs:
    lib_audit_verified: false
    attacker_calls_backdoor: true
  expected_exploit: Attacker mints AdminCap via backdoor_mint_cap and gains full admin
    control
references:
- https://owasp.org/www-project-supply-chain-security/
- https://arxiv.org/html/2601.04583v1
- https://docs.sui.io/guides/developer/sui-101/move-package-management
sui_specific: true
bvss:
  impact: High
  likelihood: Medium
  exploitability: Network
  economic_loss: Millions
  scope: Unchanged
  is_immutable: true
  exploit_maturity: POC
  privileged_access: Not Required
