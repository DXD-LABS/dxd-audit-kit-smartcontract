name: CI for Move/Sui Audit Kit

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: pip install PyYAML

      - name: Install Sui CLI (1.64.2)
        run: |
          wget https://github.com/MystenLabs/sui/releases/download/mainnet-v1.64.2/sui-mainnet-v1.64.2-ubuntu-x86_64.tgz
          tar -xvf sui-mainnet-v1.64.2-ubuntu-x86_64.tgz
          chmod +x sui
          sudo mv sui /usr/local/bin/

      - name: Run One-Click Audit
        run: |
          chmod +x one-click-audit.sh
          chmod +x scripts/check-env.sh
          ./one-click-audit.sh
