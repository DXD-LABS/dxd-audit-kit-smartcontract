name: Move Static Analysis

on:
  pull_request:
    branches: [main]

jobs:
  analyze:
    runs-on: ubuntu-latest
    env:
      SUI_VERSION: mainnet-v1.64.2
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Sui CLI
        run: curl --proto '=https' --tlsv1.2 -LsSf https://github.com/MystenLabs/sui/releases/download/${SUI_VERSION}/sui-install | sh

      - name: Install Move Lint
        run: cargo install move-lint

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python deps
        run: pip install -r static-analysis/requirements.txt -r vuln-db/requirements.txt

      - name: Run Static Analysis
        run: python static-analysis/scripts/analyze.py .
      - name: Run Static Analysis JSON
        run: python static-analysis/scripts/analyze.py . --json > lint.json
      - name: Run Scorecard on Lint
        run: python scorecard/cli.py --lint-output lint.json --output html
      - name: Upload Scorecard Artifact
        uses: actions/upload-artifact@v4
        with:
          name: scorecard-report
          path: scorecard_report.html
      - name: Run Bytecode Parse
        run: python static-analysis/scripts/parse_bytecode.py .

      - name: Generate Vuln Summary
        run: python vuln-db/parser.py

      - name: Run Vuln Tests (unit + testnet)
        run: |
          chmod +x tests/run_tests.sh
          tests/run_tests.sh
